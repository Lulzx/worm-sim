name: Rust correctness
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked --release --example fit_small
  taichi-cpu-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backends/taichi/requirements.txt
      - run: mkdir -p runs
      - run: cargo run --locked --release --example export_taichi_reference -- runs/taichi-reference.json
      - run: python backends/taichi/audit.py runs/taichi-reference.json --arch cpu --validate --output runs/taichi-cpu-audit.json
      - run: cargo run --locked --release --example export_taichi_reference -- runs/taichi-c302-reference.json data/c302-herm.wsc
      - run: python backends/taichi/audit.py runs/taichi-c302-reference.json --arch cpu --validate --output runs/taichi-c302-cpu-audit.json
      - run: python backends/taichi/test_checkpoint.py runs/taichi-reference.json
      - run: python backends/taichi/audit.py runs/taichi-c302-reference.json --checkpoint-steps 7 --arch cpu --validate --output runs/taichi-checkpoint-cpu-audit.json
