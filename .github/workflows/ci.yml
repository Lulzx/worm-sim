name: Rust correctness
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked --release --example fit_small
  taichi-cpu-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backends/taichi/requirements.txt
      - run: python scripts/test_connectome_audit.py
      - run: mkdir -p runs
      - run: cargo run --locked --release --example export_taichi_reference -- runs/taichi-reference.json
      - run: python backends/taichi/audit.py runs/taichi-reference.json --arch cpu --validate --output runs/taichi-cpu-audit.json
      - run: cargo run --locked --release --example export_taichi_reference -- runs/taichi-c302-reference.json data/c302-herm.wsc
      - run: python backends/taichi/audit.py runs/taichi-c302-reference.json --arch cpu --validate --output runs/taichi-c302-cpu-audit.json
      - run: python backends/taichi/test_checkpoint.py runs/taichi-reference.json
      - run: python backends/taichi/audit.py runs/taichi-c302-reference.json --checkpoint-steps 7 --arch cpu --validate --output runs/taichi-checkpoint-cpu-audit.json
  recording-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libhdf5-dev
      - run: cargo test --locked --features hdf5 --test recordings --test bench
      - run: cargo clippy --locked --all-targets --features hdf5 -- -D warnings
  jax-cpu-parity:
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: WORMSIM_COMMIT=$(git rev-parse HEAD) cargo build --locked --release --example external_atlas --example export_external_atlas_fixture --example export_atlas_training
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backends/jax/requirements.txt
      - run: python -m pip install -r backends/jax/requirements.txt
      - run: python -m unittest discover -s backends/jax -p 'test_*.py' -v
