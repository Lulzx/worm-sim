[package]
name = "wormsim"
version = "0.1.0"
edition = "2024"
description = "Rust reference core for a differentiable C. elegans simulator"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
csv = "1"
sha2 = "0.10"
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
