[package]
name = "wormsim"
version = "0.1.0"
edition = "2024"
description = "Rust reference core for a differentiable C. elegans simulator"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
csv = "1"
sha2 = "0.10"
zstd = "0.13"
hdf5 = { version = "=0.14.1", package = "hdf5-metno", optional = true }
serde_yaml_ng = "0.10.0"

[profile.release]
lto = "thin"
codegen-units = 1

[features]
hdf5 = ["dep:hdf5"]
